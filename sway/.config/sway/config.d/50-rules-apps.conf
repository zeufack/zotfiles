# App -> workspace rules (from the i3 assigns). Wayland apps match on app_id,
# XWayland apps on class. Find them with: swaymsg -t get_tree | grep -E 'app_id|class'

assign [app_id="^com\.mitchellh\.ghostty$"] workspace number $ws1
assign [app_id="^(code|code-url-handler)$"] workspace number $ws2
assign [class="^Code$"] workspace number $ws2
assign [app_id="^(org\.mozilla\.)?firefox(-esr)?$"] workspace number $ws3
assign [app_id="^obsidian$"] workspace number $ws4
assign [class="^obsidian$"] workspace number $ws4
assign [app_id="^pomatez$"] workspace number $ws4
assign [class="^pomatez$"] workspace number $ws4
assign [app_id="^(vlc|org\.videolan\.VLC)$"] workspace number $ws5
assign [app_id="^google-chrome$"] workspace number $ws6
assign [class="^Google-chrome$"] workspace number $ws6

# Floating utilities and dialogs
for_window [app_id="^(blueman-manager|nm-connection-editor|org\.gnome\.Calculator|swappy)$"] floating enable
for_window [window_role="^(pop-up|bubble|dialog)$"] floating enable
for_window [window_type="dialog"] floating enable
for_window [title="^(Picture-in-Picture|Picture in picture)$"] floating enable, sticky enable

# Don't let the screen sleep while something is fullscreen (video, slides)
for_window [all] inhibit_idle fullscreen
