# Replaces Fedora's file of the same name. Same keys as the old i3 config:
#   Print / $mod+Print / Shift+Print  -> save screen / window / area
#   add Ctrl to copy to the clipboard instead. $mod+Shift+s annotates an area.
# Files go to $XDG_SCREENSHOTS_DIR, else your Pictures folder.

bindsym {
    Print              exec grimshot --notify save output
    $mod+Print         exec grimshot --notify save active
    Shift+Print        exec grimshot --notify save area
    Ctrl+Print         exec grimshot --notify copy output
    Ctrl+$mod+Print    exec grimshot --notify copy active
    Ctrl+Shift+Print   exec grimshot --notify copy area
    $mod+Shift+s       exec grimshot save area - | swappy -f -
}
