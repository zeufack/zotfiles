# Extra autostart. nm-applet, blueman etc. already start via Fedora's
# 95-xdg-desktop-autostart.conf, and dunst is D-Bus activated.

# Clipboard history for $mod+Shift+v
exec sh -c 'command -v cliphist >/dev/null && exec wl-paste --watch cliphist store'

# Unlocks saved passwords (VS Code, Chrome, git credentials). sddm's PAM unlocks the
# keyring at login; this makes sure the secrets service is running for this session.
exec sh -c 'command -v gnome-keyring-daemon >/dev/null && exec gnome-keyring-daemon --start --components=secrets'

# Mount USB drives automatically, with a tray icon while one is plugged in
exec sh -c 'command -v udiskie >/dev/null && exec udiskie --automount --notify --smart-tray --appindicator'

# Warmer screen at night (or use -l LAT -L LONG to follow sunrise/sunset).
exec wlsunset -S 07:00 -s 20:00
