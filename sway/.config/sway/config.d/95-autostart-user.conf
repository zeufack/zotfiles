# Extra autostart. nm-applet, blueman etc. already start via Fedora's
# 95-xdg-desktop-autostart.conf, and dunst is D-Bus activated.

# Clipboard history for $mod+Shift+v
exec sh -c 'command -v cliphist >/dev/null && exec wl-paste --watch cliphist store'

# Warmer screen at night (or use -l LAT -L LONG to follow sunrise/sunset).
exec wlsunset -S 07:00 -s 20:00
