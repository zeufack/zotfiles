# Catppuccin Mocha (linked into ~/.config/dunst/dunstrc.d/ by theme-set)
[global]
    highlight = "#89B4FA"

[urgency_low]
    background = "#1E1E2E"
    foreground = "#A6ADC8"
    frame_color = "#313244"

[urgency_normal]
    background = "#1E1E2E"
    foreground = "#CDD6F4"
    frame_color = "#CBA6F7"

[urgency_critical]
    background = "#1E1E2E"
    foreground = "#CDD6F4"
    frame_color = "#F38BA8"
