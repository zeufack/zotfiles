# Catppuccin Mocha (sourced by ~/.tmux.conf)
# Powerline segments; the arrows need a Nerd Font (bootstrap.sh installs the symbols)
set -g status-style "bg=#1E1E2E,fg=#A6ADC8"
set -g status-left "#[fg=#1E1E2E,bg=#89B4FA,bold] #S #[fg=#89B4FA,bg=#1E1E2E,nobold] "
set -g status-right "#[fg=#313244,bg=#1E1E2E]#[fg=#BAC2DE,bg=#313244] %H:%M #[fg=#CBA6F7,bg=#313244]#[fg=#1E1E2E,bg=#CBA6F7,bold] #h "
setw -g window-status-format "#[fg=#1E1E2E,bg=#313244]#[fg=#A6ADC8,bg=#313244] #I #W #[fg=#313244,bg=#1E1E2E]"
setw -g window-status-current-format "#[fg=#1E1E2E,bg=#89B4FA]#[fg=#1E1E2E,bg=#89B4FA,bold] #I #W #[fg=#89B4FA,bg=#1E1E2E,nobold]"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#CBA6F7"
set -g message-style "bg=#313244,fg=#CDD6F4"
set -g mode-style "bg=#CBA6F7,fg=#1E1E2E"
setw -g clock-mode-colour "#89B4FA"
