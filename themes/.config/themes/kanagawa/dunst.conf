# Kanagawa (linked into ~/.config/dunst/dunstrc.d/ by theme-set)
[global]
    highlight = "#7E9CD8"

[urgency_low]
    background = "#1F1F28"
    foreground = "#938AA9"
    frame_color = "#2A2A37"

[urgency_normal]
    background = "#1F1F28"
    foreground = "#DCD7BA"
    frame_color = "#957FB8"

[urgency_critical]
    background = "#1F1F28"
    foreground = "#DCD7BA"
    frame_color = "#E46876"
