# Kanagawa (sourced by ~/.tmux.conf)
# Powerline segments; the arrows need a Nerd Font (bootstrap.sh installs the symbols)
set -g status-style "bg=#1F1F28,fg=#938AA9"
set -g status-left "#[fg=#1F1F28,bg=#7E9CD8,bold] #S #[fg=#7E9CD8,bg=#1F1F28,nobold] "
set -g status-right "#[fg=#2A2A37,bg=#1F1F28]#[fg=#C8C093,bg=#2A2A37] %H:%M #[fg=#957FB8,bg=#2A2A37]#[fg=#1F1F28,bg=#957FB8,bold] #h "
setw -g window-status-format "#[fg=#1F1F28,bg=#2A2A37]#[fg=#938AA9,bg=#2A2A37] #I #W #[fg=#2A2A37,bg=#1F1F28]"
setw -g window-status-current-format "#[fg=#1F1F28,bg=#7E9CD8]#[fg=#1F1F28,bg=#7E9CD8,bold] #I #W #[fg=#7E9CD8,bg=#1F1F28,nobold]"
set -g pane-border-style "fg=#2A2A37"
set -g pane-active-border-style "fg=#957FB8"
set -g message-style "bg=#2A2A37,fg=#DCD7BA"
set -g mode-style "bg=#957FB8,fg=#1F1F28"
setw -g clock-mode-colour "#7E9CD8"
