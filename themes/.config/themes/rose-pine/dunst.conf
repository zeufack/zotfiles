# Rosé Pine (linked into ~/.config/dunst/dunstrc.d/ by theme-set)
[global]
    highlight = "#C4A7E7"

[urgency_low]
    background = "#191724"
    foreground = "#908CAA"
    frame_color = "#26233A"

[urgency_normal]
    background = "#191724"
    foreground = "#E0DEF4"
    frame_color = "#EBBCBA"

[urgency_critical]
    background = "#191724"
    foreground = "#E0DEF4"
    frame_color = "#EB6F92"
