# Rosé Pine (sourced by ~/.tmux.conf)
# Powerline segments; the arrows need a Nerd Font (bootstrap.sh installs the symbols)
set -g status-style "bg=#191724,fg=#908CAA"
set -g status-left "#[fg=#191724,bg=#C4A7E7,bold] #S #[fg=#C4A7E7,bg=#191724,nobold] "
set -g status-right "#[fg=#26233A,bg=#191724]#[fg=#908CAA,bg=#26233A] %H:%M #[fg=#EBBCBA,bg=#26233A]#[fg=#191724,bg=#EBBCBA,bold] #h "
setw -g window-status-format "#[fg=#191724,bg=#26233A]#[fg=#908CAA,bg=#26233A] #I #W #[fg=#26233A,bg=#191724]"
setw -g window-status-current-format "#[fg=#191724,bg=#C4A7E7]#[fg=#191724,bg=#C4A7E7,bold] #I #W #[fg=#C4A7E7,bg=#191724,nobold]"
set -g pane-border-style "fg=#26233A"
set -g pane-active-border-style "fg=#EBBCBA"
set -g message-style "bg=#26233A,fg=#E0DEF4"
set -g mode-style "bg=#EBBCBA,fg=#191724"
setw -g clock-mode-colour "#C4A7E7"
