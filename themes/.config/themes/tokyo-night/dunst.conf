# Tokyo Night (linked into ~/.config/dunst/dunstrc.d/ by theme-set)
[global]
    highlight = "#7AA2F7"

[urgency_low]
    background = "#1A1B26"
    foreground = "#737AA2"
    frame_color = "#292E42"

[urgency_normal]
    background = "#1A1B26"
    foreground = "#C0CAF5"
    frame_color = "#BB9AF7"

[urgency_critical]
    background = "#1A1B26"
    foreground = "#C0CAF5"
    frame_color = "#F7768E"
