# Tokyo Night (sourced by ~/.tmux.conf)
# Powerline segments; the arrows need a Nerd Font (bootstrap.sh installs the symbols)
set -g status-style "bg=#1A1B26,fg=#737AA2"
set -g status-left "#[fg=#1A1B26,bg=#7AA2F7,bold] #S #[fg=#7AA2F7,bg=#1A1B26,nobold] "
set -g status-right "#[fg=#292E42,bg=#1A1B26]#[fg=#A9B1D6,bg=#292E42] %H:%M #[fg=#BB9AF7,bg=#292E42]#[fg=#1A1B26,bg=#BB9AF7,bold] #h "
setw -g window-status-format "#[fg=#1A1B26,bg=#292E42]#[fg=#737AA2,bg=#292E42] #I #W #[fg=#292E42,bg=#1A1B26]"
setw -g window-status-current-format "#[fg=#1A1B26,bg=#7AA2F7]#[fg=#1A1B26,bg=#7AA2F7,bold] #I #W #[fg=#7AA2F7,bg=#1A1B26,nobold]"
set -g pane-border-style "fg=#292E42"
set -g pane-active-border-style "fg=#BB9AF7"
set -g message-style "bg=#292E42,fg=#C0CAF5"
set -g mode-style "bg=#BB9AF7,fg=#1A1B26"
setw -g clock-mode-colour "#7AA2F7"
