# General
set  -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set  -g mouse on
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on
set  -g history-limit 50000
set  -g escape-time 0
set  -g focus-events on
set  -g set-clipboard on
set  -g allow-passthrough on
setw -g aggressive-resize on
set  -g detach-on-destroy off
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind-key -n M-H previous-window
bind-key -n M-L next-window

# Navigate using vim shortcuts
setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Reload
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Vi-style visual select + yank in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Splits / new windows inherit current path
bind '|' split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window    -c "#{pane_current_path}"
unbind '"'
unbind %

# Editor layout: nvim in current pane, 20%-tall shell pane below.
bind-key e split-window -v -l 20% -c "#{pane_current_path}" \; \
           select-pane -U \; \
           send-keys "nvim ." Enter



# Theme: colours from the active theme (theme-set, $mod+Shift+t)
set -g status-position bottom
set -g status-left-length 40
setw -g window-status-separator ""
source-file -q ~/.config/themes/current/tmux.conf

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'jaclu/tmux-menus'                # prefix + \ : menus
set -g @plugin 'christoomey/vim-tmux-navigator'  # C-h/j/k/l across nvim and tmux panes
set -g @plugin 'sainnhe/tmux-fzf'                # prefix + f
# tmux-fzf reads its key from this tmux environment variable
TMUX_FZF_LAUNCH_KEY="f"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf).
# Skipped when TPM isn't installed yet, so tmux starts without an error; bootstrap.sh installs it.
if-shell 'test -x ~/.tmux/plugins/tpm/tpm' "run '~/.tmux/plugins/tpm/tpm'"
